name: iOS unsigned build check

# Imports the iOS preparation (2-ios-prep.tar.gz) once, then compiles the iOS
# project for the simulator with no signing and no secrets. It does NOT make an
# installable or App Store build. Standard GitHub-hosted runner only.
on:
  workflow_dispatch:
  push:
    branches: [ios-prep]
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-unsigned-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared files (once)
        if: github.ref == 'refs/heads/ios-prep' && hashFiles('2-ios-prep.tar.gz') != ''
        run: |
          tar xzf 2-ios-prep.tar.gz
          git rm -q --cached 2-ios-prep.tar.gz
          rm 2-ios-prep.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add iOS platform (Capacitor), iOS sign-in via system browser, branded splash"
          git push origin HEAD:ios-prep
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: mkdir -p dist && npx cap sync ios
      - name: Build for simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Simulator smoke test (launch app, screenshot)
        run: |
          APP=$(find build/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.husayniya.services
          sleep 30
          xcrun simctl io "$UDID" screenshot shot1.png
          sips -Z 420 -s format jpeg -s formatOptions 45 shot1.png --out shot1.jpg
          ls -la shot1.png shot1.jpg
          echo "-----B64START"
          base64 -i shot1.jpg
          echo "-----B64END"
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: shot1.png
