name: iOS unsigned build check

# Compiles the iOS project for the simulator with no signing and no secrets,
# launches it and saves a screenshot artifact. It does NOT make an installable
# or App Store build. Standard GitHub-hosted runner only.
on:
  workflow_dispatch:
  push:
    branches: [ios-prep]
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-unsigned-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: mkdir -p dist && npx cap sync ios
      - name: Build for simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Simulator smoke test (launch app, screenshot)
        run: |
          APP=$(find build/Build/Products -name 'App.app' -maxdepth 3 | head -1)
          echo "APP=$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.husayniya.services
          sleep 30
          xcrun simctl io "$UDID" screenshot shot1.png
          ls -la shot1.png
          # Best effort: tap the notification prompt through Simulator UI scripting
          osascript -e 'tell application "System Events" to tell process "Simulator" to click (first button of window 1 whose name is "Don\u2019t Allow" or name is "Don'"'"'t Allow")' || echo "ui scripting not permitted"
          sleep 5
          xcrun simctl io "$UDID" screenshot shot2.png
          ls -la shot2.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: |
            shot1.png
            shot2.png
