name: iOS staging test (synthetic data, isolated staging Supabase)

# Branch-only. Runs the app web build against the separate STAGING Supabase project
# (never production), serves it on localhost on the runner and launches the iOS simulator
# shell against it. Push, AI and cron secrets are intentionally NOT set, so nothing is
# sent to any phone, device or external service. Synthetic user uses a reserved example.test address.
on:
  workflow_dispatch:
  push:
    branches: [ios-prep]
    paths:
      - '.github/workflows/ios-staging-test.yml'

permissions:
  contents: read

concurrency:
  group: ios-staging-test
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/ios-prep'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard (env must be explicit and non-production)
        run: |
          rm -f .env .env.local .env.production
          node scripts/assert-staging-target.mjs
      - run: npm install --legacy-peer-deps --ignore-scripts
      - name: Remove hardcoded production fallbacks (CI workspace only, not committed)
        run: |
          sed -i '' 's#"https://ryxfnrozrzkuhobxfcmw.supabase.co"#"https://staging-required.invalid"#g' src/lib/auth.functions.ts
          if grep -rn "ryxfnrozrzkuhobxfcmw" src --include=*.ts --include=*.tsx | grep -v "src/test/"; then echo "production ref still in src"; exit 1; fi
      - name: Build web (node-server)
        run: NITRO_PRESET=node-server npx vite build
      - name: Guard (scan build output for production refs)
        run: node scripts/assert-staging-target.mjs .output
      - name: Serve on localhost (no push/AI/cron env)
        run: |
          env -u STAGING_SERVICE_ROLE_KEY SUPABASE_SERVICE_ROLE_KEY="$STAGING_SERVICE_ROLE_KEY" PORT=3000 HOST=127.0.0.1 nohup node .output/server/index.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
          curl -fsS -o /dev/null -w "home http %{http_code}\n" http://127.0.0.1:3000/
      - name: Backend synthetic checks (staging only, example.test user, no email sent)
        run: |
          set -e
          PW="Ci-$(openssl rand -hex 12)"; echo "::add-mask::$PW"
          EMAIL="ci-$(date +%s)@example.test"
          H1="apikey: $STAGING_SERVICE_ROLE_KEY"; H2="Authorization: Bearer $STAGING_SERVICE_ROLE_KEY"
          UID_=$(curl -fsS -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "$H1" -H "$H2" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\",\"email_confirm\":true}" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "$UID_" > /tmp/uid
          TOK=$(curl -fsS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\"}" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$TOK"
          echo "signed in synthetic user: ok"
          N=$(curl -fsS "$SUPABASE_URL/rest/v1/stores?select=id" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $TOK" | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "stores visible to a customer: $N"
          P=$(curl -fsS "$SUPABASE_URL/rest/v1/profiles?select=id" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $TOK" | python3 -c "import sys,json;print(len(json.load(sys.stdin)))")
          echo "profiles visible to the customer (should be own only): $P"
          [ "$N" -ge 1 ]
          [ "$P" -le 1 ]
      - name: Delete synthetic user
        if: always()
        run: |
          [ -s /tmp/uid ] && curl -fsS -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$(cat /tmp/uid)" -H "apikey: $STAGING_SERVICE_ROLE_KEY" -H "Authorization: Bearer $STAGING_SERVICE_ROLE_KEY" -o /dev/null -w "delete user http %{http_code}\n" || echo "no user to delete"
      - name: Build iOS shell pointing at localhost
        run: |
          mkdir -p dist
          MAWGOOD_APP_URL=http://localhost:3000 npx cap sync ios
          grep -rn "localhost:3000" ios/App/App/capacitor.config.json
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -5
      - name: Create synthetic UI-test user (staging only, example.test, no email sent)
        run: |
          set -e
          mkdir -p /tmp/uitest-cred /tmp/uitest
          PW="Ci$(openssl rand -hex 10)"; echo "::add-mask::$PW"
          EMAIL="ci-ui-$(date +%s)@example.test"
          UID_=$(curl -fsS -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $STAGING_SERVICE_ROLE_KEY" -H "Authorization: Bearer $STAGING_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PW\",\"email_confirm\":true}" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "$UID_" > /tmp/uid-ui
          printf '{"email":"%s","password":"%s"}' "$EMAIL" "$PW" > /tmp/uitest-cred/cred.json
          echo "created synthetic UI user"
          DEMAIL="ci-driver-$(date +%s)@example.test"; DPW="Ci$(openssl rand -hex 10)"; echo "::add-mask::$DPW"
          DUID=$(curl -fsS -X POST "$SUPABASE_URL/auth/v1/admin/users" -H "apikey: $STAGING_SERVICE_ROLE_KEY" -H "Authorization: Bearer $STAGING_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DEMAIL\",\"password\":\"$DPW\",\"email_confirm\":true}" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "$DUID" > /tmp/uid-driver
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/drivers" -H "apikey: $STAGING_SERVICE_ROLE_KEY" -H "Authorization: Bearer $STAGING_SERVICE_ROLE_KEY" -H 'Content-Type: application/json' -H 'Prefer: return=minimal' \
            -d "{\"user_id\":\"$DUID\",\"full_name\":\"CI Driver (synthetic)\",\"phone\":\"01999999998\",\"is_active\":true}" -w "driver row http %{http_code}\n"
      - name: UI test - real login through the iOS app (staging, localhost shell)
        id: ui
        continue-on-error: true
        run: |
          gem install xcodeproj --user-install --no-document
          mkdir -p ios/App/AppUITests
          cat > ios/App/AppUITests/AppUITests.swift <<'SWIFT'
          import XCTest

          final class AppUITests: XCTestCase {
              let dir = "/tmp/uitest"

              func snap(_ app: XCUIApplication, _ name: String) {
                  try? FileManager.default.createDirectory(atPath: dir, withIntermediateDirectories: true)
                  try? app.screenshot().pngRepresentation.write(to: URL(fileURLWithPath: "\(dir)/\(name).png"))
                  try? app.debugDescription.write(toFile: "\(dir)/\(name).txt", atomically: true, encoding: .utf8)
              }

              func label(_ app: XCUIApplication, _ text: String) -> XCUIElement {
                  return app.descendants(matching: .any).matching(NSPredicate(format: "label == %@", text)).firstMatch
              }

              func testLoginWithSyntheticUser() throws {
                  let data = try Data(contentsOf: URL(fileURLWithPath: "/tmp/uitest-cred/cred.json"))
                  let cred = try JSONSerialization.jsonObject(with: data) as! [String: String]
                  let app = XCUIApplication()
                  app.launch()
                  let sb = XCUIApplication(bundleIdentifier: "com.apple.springboard")
                  let deny = sb.alerts.buttons.matching(NSPredicate(format: "label BEGINSWITH %@", "Don")).firstMatch
                  if deny.waitForExistence(timeout: 45) { deny.tap() }
                  XCTAssertTrue(app.webViews.firstMatch.waitForExistence(timeout: 30), "web view not shown")
                  let home = label(app, "الرئيسية")
                  XCTAssertTrue(home.waitForExistence(timeout: 30), "home tab not found")
                  sleep(3)
                  snap(app, "01-home")
                  let accLinks = app.links.matching(NSPredicate(format: "label == %@", "حسابي")).allElementsBoundByIndex
                  let acc = accLinks.max(by: { $0.frame.minY < $1.frame.minY })
                  XCTAssertNotNil(acc, "account tab not found")
                  acc?.tap()
                  sleep(4)
                  snap(app, "02-account-or-auth")
                  let idField = app.textFields.firstMatch
                  XCTAssertTrue(idField.waitForExistence(timeout: 20), "login identifier field not found")
                  idField.tap()
                  idField.typeText(cred["email"]!)
                  let pw = app.secureTextFields.firstMatch
                  XCTAssertTrue(pw.waitForExistence(timeout: 10), "password field not found")
                  pw.tap()
                  pw.typeText(cred["password"]!)
                  snap(app, "03-filled")
                  let btns = app.buttons.matching(NSPredicate(format: "label == %@", "تسجيل الدخول")).allElementsBoundByIndex
                  let submit = btns.max(by: { $0.frame.minY < $1.frame.minY })
                  XCTAssertNotNil(submit, "sign-in button not found")
                  submit?.tap()
                  sleep(8)
                  snap(app, "04-after-login")
                  let acc2 = app.links.matching(NSPredicate(format: "label == %@", "حسابي")).allElementsBoundByIndex.max(by: { $0.frame.minY < $1.frame.minY })
                  acc2?.tap()
                  sleep(4)
                  snap(app, "05-account-logged-in")
                  let logout = label(app, "تسجيل الخروج")
                  var found = logout.waitForExistence(timeout: 10)
                  if !found { app.swipeUp(); found = logout.waitForExistence(timeout: 5) }
                  snap(app, "06-final")
                  XCTAssertTrue(found, "after login the account page did not show the logout button (login via the real UI failed)")
          func stage(_ n: String) { try? n.write(toFile: "\(dir)/stage.txt", atomically: true, encoding: .utf8) }
          stage("login-ok")
          label(app, "الرئيسية").tap()
          sleep(4)
          let storeCard = app.descendants(matching: .any).matching(NSPredicate(format: "label CONTAINS %@", "أبو حسين")).firstMatch
          var tries = 0
          while !storeCard.exists && tries < 8 { app.swipeUp(); tries += 1; sleep(1) }
          snap(app, "07-store-list")
          XCTAssertTrue(storeCard.exists, "sample store card (أبو حسين) not found on home")
          storeCard.tap()
          sleep(5)
          snap(app, "08-store")
          let add = app.descendants(matching: .any).matching(NSPredicate(format: "label BEGINSWITH %@ OR label == %@", "إضافة", "أضف للسلة")).firstMatch
          tries = 0
          while !add.exists && tries < 8 { app.swipeUp(); tries += 1; sleep(1) }
          XCTAssertTrue(add.exists, "add-to-cart control not found in store page")
          add.tap()
          sleep(2)
          snap(app, "09-added")
          stage("added-to-cart")
          let cartTab = app.links.matching(NSPredicate(format: "label == %@", "السلة")).allElementsBoundByIndex.max(by: { $0.frame.minY < $1.frame.minY })
          XCTAssertNotNil(cartTab, "cart tab not found")
          cartTab?.tap()
          sleep(5)
          snap(app, "10-cart")
          let addr = app.textFields.matching(NSPredicate(format: "placeholderValue CONTAINS %@", "اكتب عنوانك")).firstMatch
          tries = 0
          while !addr.exists && tries < 6 { app.swipeUp(); tries += 1; sleep(1) }
          XCTAssertTrue(addr.exists, "address field not found in cart")
          addr.tap(); addr.typeText("Test address staging")
          let phone = app.textFields.matching(NSPredicate(format: "placeholderValue == %@", "01xxxxxxxxx")).firstMatch
          tries = 0
          while !phone.exists && tries < 4 { app.swipeUp(); tries += 1; sleep(1) }
          XCTAssertTrue(phone.exists, "phone field not found in cart")
          phone.tap(); phone.typeText("01999999999")
          snap(app, "11-checkout-filled")
          let confirm = app.buttons.matching(NSPredicate(format: "label == %@", "تأكيد وإرسال الطلب")).firstMatch
          tries = 0
          while !confirm.exists && tries < 6 { app.swipeUp(); tries += 1; sleep(1) }
          XCTAssertTrue(confirm.exists, "confirm button not found (store closed or no active driver would show another label)")
          confirm.tap()
          sleep(8)
          snap(app, "12-after-order")
          stage("order-submitted")
              }
          }
          SWIFT
          cat > /tmp/add_ui_target.rb <<'RUBY'
          require 'xcodeproj'
          proj = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = proj.targets.find { |t| t.name == 'App' }
          t = proj.new_target(:ui_test_bundle, 'AppUITests', :ios, '15.0')
          t.add_dependency(app)
          g = proj.main_group.new_group('AppUITests', 'AppUITests')
          t.add_file_references([g.new_file('AppUITests.swift')])
          t.build_configurations.each do |c|
            c.build_settings['TEST_TARGET_NAME'] = 'App'
            c.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.husayniya.services.uitests'
            c.build_settings['GENERATE_INFOPLIST_FILE'] = 'YES'
            c.build_settings['SWIFT_VERSION'] = '5.0'
            c.build_settings['PRODUCT_NAME'] = '$(TARGET_NAME)'
            c.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
          end
          proj.save
          sch = Xcodeproj::XCScheme.new
          sch.add_build_target(app)
          sch.add_test_target(t)
          sch.set_launch_target(app)
          sch.save_as('ios/App/App.xcodeproj', 'AppUITests', true)
          RUBY
          ruby /tmp/add_ui_target.rb
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'])")
          xcrun simctl shutdown all || true
          xcodebuild test -project ios/App/App.xcodeproj -scheme AppUITests \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath build2 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60
          exit ${PIPESTATUS[0]}
      - name: Verify order in staging DB and clean up (orders, driver, users)
        if: always()
        run: |
          H1="apikey: $STAGING_SERVICE_ROLE_KEY"; H2="Authorization: Bearer $STAGING_SERVICE_ROLE_KEY"
          curl -sS "$SUPABASE_URL/rest/v1/orders?select=id,status&order=created_at.desc&limit=5" -H "$H1" -H "$H2" > /tmp/orders.json
          python3 -c "import json;d=json.load(open('/tmp/orders.json'));print('orders in staging:',len(d),[o.get('status') for o in d] if isinstance(d,list) else d)"
          IDS=$(python3 -c "import json;d=json.load(open('/tmp/orders.json'));print(','.join(o['id'] for o in d) if isinstance(d,list) else '')")
          if [ -n "$IDS" ]; then
            curl -sS -X DELETE "$SUPABASE_URL/rest/v1/order_items?order_id=in.($IDS)" -H "$H1" -H "$H2" -o /dev/null -w "delete order_items http %{http_code}\n" || true
            curl -sS -X DELETE "$SUPABASE_URL/rest/v1/orders?id=in.($IDS)" -H "$H1" -H "$H2" -o /dev/null -w "delete orders http %{http_code}\n" || true
          fi
          [ -s /tmp/uid-driver ] && curl -sS -X DELETE "$SUPABASE_URL/rest/v1/drivers?user_id=eq.$(cat /tmp/uid-driver)" -H "$H1" -H "$H2" -o /dev/null -w "delete driver row http %{http_code}\n" || true
          [ -s /tmp/uid-driver ] && curl -sS -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$(cat /tmp/uid-driver)" -H "$H1" -H "$H2" -o /dev/null -w "delete driver user http %{http_code}\n" || true
      - name: Delete synthetic UI user
        if: always()
        run: |
          rm -f /tmp/uitest-cred/cred.json
          [ -s /tmp/uid-ui ] && curl -fsS -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$(cat /tmp/uid-ui)" -H "apikey: $STAGING_SERVICE_ROLE_KEY" -H "Authorization: Bearer $STAGING_SERVICE_ROLE_KEY" -o /dev/null -w "delete ui user http %{http_code}\n" || echo "no ui user to delete"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-ui
          path: |
            /tmp/uitest/
            /tmp/server.log
      - name: Fail if UI test failed
        if: steps.ui.outcome == 'failure'
        run: exit 1
